name: Release

# Publish a release on GitHub (tag vX.Y.Z) and this workflow attaches the zips.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for m in extension/manifest.json extension-native/manifest.json; do
            v=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$m")
            test "v$v" = "$TAG" || { echo "$m is $v, tag is $TAG"; exit 1; }
          done
      - name: Build zips
        run: ./scripts/package.sh
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
