name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          for m in extension/manifest.json extension-native/manifest.json; do
            v=$(python3 -c "import json;print(json.load(open('$m'))['version'])")
            test "v$v" = "$GITHUB_REF_NAME" || { echo "$m is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Build zips
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "GX-like Dark Mode ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
